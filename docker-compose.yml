services:
  app:
    build:
      context: .
    container_name: ai-app

    volumes:
      - .:/app

    working_dir: /app
    command: sleep infinity

    ports:
      - "8000:8000"

    environment:
      - OLLAMA_HOST=http://ollama:11434

    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    container_name: ollama

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

    restart: unless-stopped

volumes:
  ollama_data: